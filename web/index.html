<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>TideWatch 监测台</title>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 40px; background: #fafafa; }
h1 { color: #333; }
#status { font-weight: bold; }
#priorityTarget { color: #d32f2f; }
.card { border: 2px solid #ccc; border-radius: 8px; padding: 16px; margin: 12px 0; background: white; }
.card.洪水预警 { border-color: red; background: #ffecec; }
.card.高水位警戒 { border-color: orange; background: #fff4e0; }
.card.水质浑浊 { border-color: purple; background: #f4ecff; }
.card.正常 { border-color: green; background: #ecfff0; }
.card.priority { border-color: #1a73e8; box-shadow: 0 0 0 3px #1a73e8, 0 4px 12px rgba(0,0,0,.25); }
.event { border: 2px solid #ccc; border-radius: 8px; padding: 12px; margin: 12px 0; background: white; }
.event.OPEN { border-color: red; background: #ffecec; }
.event.HANDLING { border-color: orange; background: #fff4e0; }
.event.RECOVERED { border-color: green; background: #ecfff0; }
.event p { margin: 4px 0; }
.event button { margin-top: 8px; padding: 6px 12px; cursor: pointer; }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; }
.modal { background: white; padding: 24px; border-radius: 8px; }
.modal button { margin: 6px 8px 0 0; padding: 6px 12px; cursor: pointer; }
#testPanel button { margin: 6px 8px 0 0; padding: 6px 12px; cursor: pointer; }
#msgStats { color: #666; font-size: 14px; }
#rejectReason { color: #c62828; font-size: 13px; }
.muted { color: #666; font-size: 13px; }
.card.viewing { outline: 3px solid #1a73e8; outline-offset: 2px; }
.perc { border: 1px solid #ccc; border-radius: 6px; padding: 8px; margin: 8px 0; background: #fafafa; }
.perc p { margin: 2px 0; font-size: 13px; }
#photoThumbs img { height: 56px; margin: 4px; border-radius: 4px; border: 1px solid #ccc; }
#multiModal button { margin: 6px 8px 0 0; padding: 8px 14px; font-size: 14px; cursor: pointer; }
.card h2 { margin: 0 0 8px 0; }
.card p { margin: 4px 0; }
</style>
</head>
<body>
<h1>TideWatch 监测台</h1>
<p>连接状态：<span id="status">未连接</span></p>
<p>当前优先关注：<strong id="priorityTarget">暂无</strong><span id="priorityScore"></span></p>
<div id="cards"></div>

<h2>事件列表</h2>
<p id="msgStats">已处理消息：0 · 重复丢弃：0 · 乱序/迟到：0 · 拒绝：0</p>
<p id="rejectReason">最近拒绝：—</p>
<div id="events"></div>

<h2>测试面板</h2>
<div id="testPanel">
  <p id="testLastMsg">最近消息：暂无</p>
  <button id="btnDup">重复发送最近消息</button>
  <button id="btnOld">发送旧数据（time 提前 10 分钟）</button>
  <button id="btnMsgId">发送带 message_id 的消息</button>
  <button id="btnWrongTopic">发送错误 Topic</button>
  <button id="btnBadJson">发送错误 JSON</button>
</div>

<h2>多模态交互</h2>
<div id="multiModal">
  <p>当前查看断面：<span id="viewReach">未指定（默认优先关注断面）</span></p>
  <button id="btnAsr">🎤 语音指令</button>
  <button id="btnTts">🔊 朗读结论</button>
  <button id="btnPhoto">📷 拍照记录</button>
  <button id="btnSavePhoto" style="display:none;">保存图片</button>
  <p id="asrResult" class="muted">语音结果：—</p>
  <div id="photoThumbs"></div>
  <h3>感知记录</h3>
  <div id="perceptionList"><p class="muted">暂无记录</p></div>
</div>

<div id="cameraModal" class="modal-backdrop" style="display:none;">
  <div class="modal">
    <h3>拍照记录</h3>
    <video id="cameraVideo" autoplay playsinline style="width:320px;max-width:80vw;border-radius:8px;background:#000;"></video>
    <p id="cameraInfo" class="muted"></p>
    <button id="btnCapture">拍照</button>
    <button id="btnCameraCancel">取消</button>
  </div>
</div>

<div id="actionModal" class="modal-backdrop" style="display:none;">
  <div class="modal">
    <h3>选择干预动作</h3>
    <p id="actionModalInfo"></p>
    <button data-action="开闸泄洪">开闸泄洪</button>
    <button data-action="开启泵站">开启泵站</button>
    <button data-action="投加净水剂">投加净水剂</button>
    <button id="actionCancel">取消</button>
  </div>
</div>

<script src="mqtt.min.js"></script>
<script>
const BROKER_WS = "ws://localhost:8083";
const TOPIC = "tidewatch/+/state";

const state = {};
const anomalyStreak = {}; // reachId -> 连续异常次数
const ENV_SCORE = { "洪水预警": 3, "高水位警戒": 2, "水质浑浊": 1, "正常": 0 };
const FLOW_TEXT = { 0: "缓流", 1: "平稳", 2: "湍急", 3: "湍流" };
const photos = [];
const perceptionRecords = [];
let currentReach = null; // ASR“查看 reach-x”选中的断面；null = 默认优先关注断面
const events = [];
const openEventByReach = {}; // reachId -> 未关闭事件（OPEN/HANDLING），防重复创建
const seenKeys = new Set();   // 去重键：m:message_id 或 h:载荷哈希
const latestTimeByReach = {}; // 断面最新 time，乱序判断基准
const lateMessages = [];      // 迟到消息历史补充（F12 可查，最多 10 条）
let processedCount = 0, dupCount = 0, lateCount = 0, rejectedCount = 0;
let lastRejectReason = null;
const KNOWN_REACHES = ["reach-a", "reach-b", "reach-c"];
let lastProcessed = null;     // 最近一条已处理消息，供测试面板使用

if (typeof mqtt === "undefined") {
  const el = document.getElementById("status");
  el.textContent = "mqtt.js 加载失败";
  el.style.color = "red";
  throw new Error("mqtt.js 加载失败");
}

const client = mqtt.connect(BROKER_WS);

client.on("connect", () => {
  document.getElementById("status").textContent = "已连接";
  document.getElementById("status").style.color = "green";
  client.subscribe(TOPIC);
  client.subscribe("tidewatch/intervention", { qos: 1 });
});

client.on("error", (err) => {
  document.getElementById("status").textContent = "连接失败：" + err.message;
  document.getElementById("status").style.color = "red";
});

client.on("message", (topic, message) => {
  let data;
  try {
    data = JSON.parse(message.toString());
  } catch (e) {
    console.error("JSON 解析失败", message.toString());
    if (topic.endsWith("/state")) {
      rejectedCount++;
      lastRejectReason = "JSON 格式错误";
      render();
    }
    return;
  }
  if (topic === "tidewatch/intervention") {
    handleIntervention(data, message.toString());
    return;
  }
  // D4：写错 Topic —— topic 断面段不合法则拒绝，不进入状态处理
  const m = topic.match(/^tidewatch\/(.+)\/state$/);
  if (m && KNOWN_REACHES.indexOf(m[1]) < 0) {
    console.warn("错误 Topic 被拒绝：", topic);
    rejectedCount++;
    lastRejectReason = "Topic 错误：" + topic;
    render();
    return;
  }
  handleMessage(data);
});

// contract 6.5：reachId + time + waterLevel + turbidity + flowLevel，不含 event_id/status
function msgHash(d) {
  return d.reachId + "|" + d.time + "|" + d.waterLevel + "|" + d.turbidity + "|" + (d.flowLevel ?? "");
}

function handleMessage(data) {
  // 数据质量前置（contract 8.4）：缺字段拒绝
  if (!data.reachId || typeof data.status !== "string" ||
      typeof data.waterLevel !== "number" || typeof data.turbidity !== "number") {
    rejectedCount++;
    lastRejectReason = "缺字段";
    render();
    return;
  }
  // 时钟校验：格式错误或不可解析拒绝
  if (typeof data.time !== "string" ||
      !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(data.time) ||
      isNaN(Date.parse(data.time.replace(" ", "T")))) {
    rejectedCount++;
    lastRejectReason = "时钟异常";
    render();
    return;
  }

  // D3-4a 去重：优先 message_id，其次载荷哈希；同一条只生效一次
  const hashKey = "h:" + msgHash(data);
  const idKey = data.message_id ? "m:" + data.message_id : null;
  if ((idKey && seenKeys.has(idKey)) || seenKeys.has(hashKey)) {
    dupCount++;
    render();
    return;
  }
  seenKeys.add(hashKey);
  if (idKey) seenKeys.add(idKey);

  // D3-4b 乱序/迟到：不早于断面最新 time 才算新数据；旧消息不覆盖状态、不动事件
  const latest = latestTimeByReach[data.reachId];
  if (latest !== undefined && data.time <= latest) {
    lateCount++;
    lateMessages.push(data);
    if (lateMessages.length > 10) lateMessages.shift();
    render();
    return;
  }
  latestTimeByReach[data.reachId] = data.time;
  processedCount++;
  lastProcessed = { ...data };

  const prev = state[data.reachId];
  const wasNormal = !prev || prev.status === "正常";

  if (data.status === "正常") {
    anomalyStreak[data.reachId] = 0;
  } else {
    anomalyStreak[data.reachId] = (anomalyStreak[data.reachId] || 0) + 1;
  }
  state[data.reachId] = data;

  // D3-1：正常 → 非正常，且该断面无未关闭事件 → 创建 OPEN 事件
  if (data.status !== "正常" && wasNormal && !openEventByReach[data.reachId]) {
    const sc = scoreOf(data.reachId);
    const problem = [];
    if (data.status === "洪水预警" || data.status === "高水位警戒") problem.push("水位异常");
    if (data.status === "水质浑浊") problem.push("水质异常");
    if ((data.flowLevel ?? 0) >= 2) problem.push("水流异常");
    const totals = Object.values(state).map(d => scoreOf(d.reachId).total);
    const uniqueTop = sc.total === Math.max(...totals) && totals.filter(t => t === sc.total).length === 1;
    const ev = {
      event_id: "evt-" + data.reachId + "-" + data.time.replace(/[- :]/g, ""),
      reachId: data.reachId,
      start_time: data.time,
      problem,
      priority_reason: `优先分 ${sc.total}（环境 ${sc.env} + 感知 ${sc.perc} + 持续 ${sc.persist}）` + (uniqueTop ? "，当前优先关注" : ""),
      action: null,
      verify_data: [],
      state: "OPEN",
      recover_time: null,
    };
    events.push(ev);
    openEventByReach[data.reachId] = ev;
    publishEventUpdate(ev);
  }

  // D3-3：HANDLING 事件的恢复判定，只能由新数据触发
  const ev = openEventByReach[data.reachId];
  if (ev && ev.state === "HANDLING") {
    ev.verify_data.push({
      time: data.time,
      waterLevel: data.waterLevel,
      turbidity: data.turbidity,
      flowLevel: data.flowLevel,
      status: data.status,
    });
    if (checkRecovery(ev, data)) {
      ev.state = "RECOVERED";
      ev.recover_time = data.time;
      delete openEventByReach[data.reachId];
      publishEventUpdate(ev);
    }
  }

  render();
}

// E3 事件广播 / 干预同步（contract 第 5 节）
const seenEventKeys = new Set(); // 事件类消息去重：优先 message_id，否则整条载荷

function publishEventUpdate(ev) {
  client.publish("tidewatch/event/update", JSON.stringify({
    event_id: ev.event_id,
    reachId: ev.reachId,
    start_time: ev.start_time,
    problem: ev.problem,
    priority_reason: ev.priority_reason,
    action: ev.action,
    verify_data: ev.verify_data,
    state: ev.state,
    recover_time: ev.recover_time,
  }), { qos: 1 });
}

function publishIntervention(ev, action) {
  client.publish("tidewatch/intervention",
    JSON.stringify({ event_id: ev.event_id, reachId: ev.reachId, action }), { qos: 1 });
}

function handleIntervention(data, raw) {
  if (!data || typeof data.event_id !== "string" || typeof data.action !== "string") return;
  const key = data.message_id ? "m:" + data.message_id : "s:" + raw;
  if (seenEventKeys.has(key)) return;
  seenEventKeys.add(key);
  const ev = events.find(x => x.event_id === data.event_id);
  if (!ev) {
    console.warn("收到未知事件的干预：", data.event_id);
    return;
  }
  if (ev.state === "RECOVERED") {
    console.warn("已恢复事件不接受干预：", data.event_id);
    return;
  }
  if (ev.state === "HANDLING" && ev.action === data.action) return; // 幂等，不回广播
  ev.action = data.action;
  ev.state = "HANDLING";
  publishEventUpdate(ev);
  render();
}

function scoreOf(reachId) {
  const d = state[reachId];
  const env = ENV_SCORE[d.status] || 0;
  const perc = d.flowLevel ?? 0;
  const streak = anomalyStreak[reachId] || 0;
  const persist = streak >= 3 ? 2 : (streak >= 1 ? 1 : 0);
  return { env, perc, persist, streak, total: env + perc + persist };
}

// contract 6.4：事件所有触发原因的条件都满足才算恢复
function checkRecovery(ev, data) {
  if (ev.problem.includes("水位异常") && data.waterLevel >= 7.0) return false;
  if (ev.problem.includes("水质异常") && data.turbidity >= 60) return false;
  if (ev.problem.includes("水流异常") && (data.flowLevel ?? 0) > 1) return false;
  return true;
}

function topReach() {
  let top = null;
  Object.values(state).forEach(d => {
    const total = scoreOf(d.reachId).total;
    if (!top || total > top.total) top = { reachId: d.reachId, total };
  });
  return top;
}

function render() {
  document.getElementById("msgStats").textContent =
    `已处理消息：${processedCount} · 重复丢弃：${dupCount} · 乱序/迟到：${lateCount} · 拒绝：${rejectedCount}`;
  document.getElementById("rejectReason").textContent =
    lastRejectReason ? `最近拒绝：${lastRejectReason}` : "最近拒绝：—";
  document.getElementById("testLastMsg").textContent = lastProcessed
    ? `最近消息：${lastProcessed.reachId} ${lastProcessed.time} 水位${lastProcessed.waterLevel} 浊度${lastProcessed.turbidity} flow${lastProcessed.flowLevel}`
    : "最近消息：暂无";

  const top = topReach();

  if (top) {
    document.getElementById("priorityTarget").textContent = top.reachId;
    document.getElementById("priorityScore").textContent = `（优先分 ${top.total}）`;
  }

  const container = document.getElementById("cards");
  container.innerHTML = "";
  Object.values(state).forEach(d => {
    const sc = scoreOf(d.reachId);
    const div = document.createElement("div");
    div.className = "card " + d.status +
      (top && d.reachId === top.reachId ? " priority" : "") +
      (d.reachId === currentReach ? " viewing" : "");
    div.innerHTML = `
      <h2>${d.reachId}</h2>
      <p>水位：${d.waterLevel}</p>
      <p>浊度：${d.turbidity}</p>
      <p>水流等级：${d.flowLevel}</p>
      <p>状态：<strong>${d.status}</strong></p>
      <p>优先分：${sc.total}（环境 ${sc.env} + 感知 ${sc.perc} + 持续 ${sc.persist}）</p>
      <p>连续异常：${sc.streak} 次</p>
      <p>时间：${d.time}</p>
    `;
    container.appendChild(div);
  });

  renderEvents();
}

function renderEvents() {
  const container = document.getElementById("events");
  container.innerHTML = "";
  if (events.length === 0) {
    container.innerHTML = "<p>暂无事件</p>";
    return;
  }
  events.forEach(ev => {
    const div = document.createElement("div");
    div.className = "event " + ev.state;
    div.innerHTML = `
      <p><strong>${ev.event_id}</strong> <span>[${ev.state}]</span></p>
      <p>断面：${ev.reachId}</p>
      <p>问题：${ev.problem.join("、")}</p>
      <p>关注理由：${ev.priority_reason}</p>
      <p>开始时间：${ev.start_time}</p>
      ${ev.state === "HANDLING" ? `<p>处理中：${ev.action}</p>` : ""}
      ${ev.state === "RECOVERED" ? `<p>已恢复：${ev.recover_time}</p>` : ""}
      ${ev.state !== "OPEN" ? `<p>验证数据：${ev.verify_data.length} 条</p>` : ""}
    `;
    if (ev.state === "OPEN") {
      const btn = document.createElement("button");
      btn.textContent = "开始干预";
      btn.addEventListener("click", () => openActionModal(ev));
      div.appendChild(btn);
    }
    container.appendChild(div);
  });
}

let pendingEventId = null;

function openActionModal(ev) {
  pendingEventId = ev.event_id;
  document.getElementById("actionModalInfo").textContent = `断面 ${ev.reachId} · ${ev.event_id}`;
  document.getElementById("actionModal").style.display = "flex";
}

// 只在点到 data-action 按钮时才改状态；取消/点背景只关闭弹窗
document.getElementById("actionModal").addEventListener("click", (e) => {
  const action = e.target.getAttribute("data-action");
  if (action) {
    const ev = events.find(x => x.event_id === pendingEventId);
    if (ev && ev.state === "OPEN") {
      ev.action = action;
      ev.state = "HANDLING";
      publishEventUpdate(ev);
      publishIntervention(ev, action);
    }
  }
  pendingEventId = null;
  document.getElementById("actionModal").style.display = "none";
  render();
});

// 测试面板：注入走与 MQTT 相同的 handleMessage 处理管线
document.getElementById("btnDup").addEventListener("click", () => {
  if (!lastProcessed) { alert("还没有已处理消息"); return; }
  handleMessage({ ...lastProcessed });
});

document.getElementById("btnOld").addEventListener("click", () => {
  if (!lastProcessed) { alert("还没有已处理消息"); return; }
  const ts = new Date(lastProcessed.time.replace(" ", "T"));
  ts.setMinutes(ts.getMinutes() - 10);
  const p = n => String(n).padStart(2, "0");
  const time = `${ts.getFullYear()}-${p(ts.getMonth() + 1)}-${p(ts.getDate())} ${p(ts.getHours())}:${p(ts.getMinutes())}:${p(ts.getSeconds())}`;
  handleMessage({ ...lastProcessed, time });
});

document.getElementById("btnMsgId").addEventListener("click", () => {
  if (!lastProcessed) { alert("还没有已处理消息"); return; }
  // 水位 +0.1 使载荷哈希不同，第一次正常处理；再点一次被 message_id 拦下
  handleMessage({ ...lastProcessed, message_id: "test-msg-1", waterLevel: lastProcessed.waterLevel + 0.1 });
});

// D4 故障演示（contract 第 11 节）：真实 MQTT 注入故障消息
document.getElementById("btnWrongTopic").addEventListener("click", () => {
  // 写错 Topic：内容正常但发到不存在的断面 topic；带旧时间戳，
  // 即使落到没有 topic 校验的订阅端也会被乱序守卫丢弃，双保险不污染状态
  client.publish("tidewatch/wrong-topic/state", JSON.stringify({
    reachId: "reach-a",
    waterLevel: 4.5,
    turbidity: 20,
    flowLevel: 0,
    status: "正常",
    time: "2000-01-01 00:00:00",
  }), { qos: 1 });
});

document.getElementById("btnBadJson").addEventListener("click", () => {
  // 错误 JSON：格式非法，解析失败被拒绝
  client.publish("tidewatch/reach-a/state", "{reachId: reach-a, waterLevel: }", { qos: 1 });
});

/* ---------- 多模态交互（contract 第 4 节 / E2） ---------- */
function lastEventOf(reachId) {
  return events.filter(e => e.reachId === reachId).pop();
}

function setCurrentReach(reachId) {
  if (!state[reachId]) {
    document.getElementById("asrResult").textContent = `断面 ${reachId} 暂无数据`;
    return;
  }
  currentReach = reachId;
  document.getElementById("viewReach").textContent = reachId;
  document.getElementById("asrResult").textContent = `已切换到 ${reachId}`;
  render();
  const card = document.querySelector(".card.viewing");
  if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
}

// TTS：朗读当前查看断面（未指定时用优先关注断面）的真实 MQTT 状态
function ttsSpeak() {
  const reachId = currentReach || (topReach() ? topReach().reachId : null);
  const d = reachId ? state[reachId] : null;
  const text = d
    ? `${d.reachId}，水位 ${d.waterLevel}，浊度 ${d.turbidity}，水流${FLOW_TEXT[d.flowLevel] ?? d.flowLevel}，状态${d.status}`
    : "暂无数据";
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

document.getElementById("btnTts").addEventListener("click", ttsSpeak);

// ASR：Web Speech API
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let recognizing = false;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "zh-CN";
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    document.getElementById("asrResult").textContent = "语音结果：" + text;
    handleVoiceCommand(text);
  };
  recognition.onerror = (e) => {
    document.getElementById("asrResult").textContent = "语音识别错误：" + e.error;
  };
  recognition.onend = () => {
    recognizing = false;
    document.getElementById("btnAsr").textContent = "🎤 语音指令";
  };
}

function handleVoiceCommand(text) {
  const m = text.match(/reach\s*-?\s*([abc])/i);
  if (m) {
    setCurrentReach("reach-" + m[1].toLowerCase());
    return;
  }
  if (text.includes("朗读")) {
    ttsSpeak();
    return;
  }
  document.getElementById("asrResult").textContent = "未识别的指令：" + text;
}

document.getElementById("btnAsr").addEventListener("click", () => {
  if (!recognition) {
    alert("当前浏览器不支持 Web Speech API（建议 Chrome/Edge）");
    return;
  }
  if (recognizing) {
    recognition.stop();
    return;
  }
  recognizing = true;
  document.getElementById("btnAsr").textContent = "🎤 正在聆听…";
  recognition.start();
});

// Camera：拍照 → 缩略图 → 感知结果记录（contract 4.2）
let cameraStream = null;
const photoTarget = { reachId: null, eventId: null };

document.getElementById("btnPhoto").addEventListener("click", async () => {
  const reachId = currentReach || (topReach() ? topReach().reachId : null);
  if (!reachId) {
    alert("暂无断面数据");
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("当前浏览器不支持摄像头（建议 Chrome/Edge）");
    return;
  }
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
  } catch (e) {
    alert("无法打开摄像头：" + e.message);
    return;
  }
  photoTarget.reachId = reachId;
  photoTarget.eventId = (openEventByReach[reachId] || lastEventOf(reachId))?.event_id ?? null;
  const video = document.getElementById("cameraVideo");
  video.srcObject = cameraStream;
  document.getElementById("cameraInfo").textContent =
    `关联断面：${reachId}${photoTarget.eventId ? " · 事件：" + photoTarget.eventId : " · 无关联事件"}`;
  document.getElementById("cameraModal").style.display = "flex";
});

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  document.getElementById("cameraVideo").srcObject = null;
  document.getElementById("cameraModal").style.display = "none";
}

document.getElementById("btnCapture").addEventListener("click", () => {
  const video = document.getElementById("cameraVideo");
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext("2d").drawImage(video, 0, 0);
  const p = n => String(n).padStart(2, "0");
  const now = new Date();
  const ts = `${now.getFullYear()}${p(now.getMonth() + 1)}${p(now.getDate())}${p(now.getHours())}${p(now.getMinutes())}${p(now.getSeconds())}`;
  const photo = {
    imageId: "img-" + photoTarget.reachId + "-" + ts,
    reachId: photoTarget.reachId,
    eventId: photoTarget.eventId,
    time: `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`,
    dataUrl: canvas.toDataURL("image/png"),
  };
  photos.push(photo);
  // 感知结果记录：simulated 不伪造置信度，confidence 恒为 null
  perceptionRecords.push({
    reachId: photo.reachId,
    imageId: photo.imageId,
    flowLevel: state[photo.reachId] ? state[photo.reachId].flowLevel : null,
    confidence: null,
    source: "simulated",
    time: photo.time,
  });
  renderPhotos();
  renderPerceptions();
  stopCamera();
});

document.getElementById("btnCameraCancel").addEventListener("click", stopCamera);

function renderPhotos() {
  const el = document.getElementById("photoThumbs");
  el.innerHTML = photos.map(ph => `<img src="${ph.dataUrl}" title="${ph.imageId}">`).join("");
  document.getElementById("btnSavePhoto").style.display = photos.length ? "inline-block" : "none";
}

function renderPerceptions() {
  const el = document.getElementById("perceptionList");
  if (!perceptionRecords.length) {
    el.innerHTML = '<p class="muted">暂无记录</p>';
    return;
  }
  el.innerHTML = [...perceptionRecords].reverse().map(r => `
    <div class="perc">
      <p><b>${r.imageId}</b></p>
      <p>断面：${r.reachId} · flowLevel：${r.flowLevel} · source：${r.source} · confidence：${r.confidence}</p>
      <p>时间：${r.time}</p>
    </div>
  `).join("");
}

document.getElementById("btnSavePhoto").addEventListener("click", () => {
  const photo = photos[photos.length - 1];
  if (!photo) return;
  const a = document.createElement("a");
  a.href = photo.dataUrl;
  a.download = photo.imageId + ".png";
  a.click();
});
</script>
